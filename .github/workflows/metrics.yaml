name: Metrics

on:
  # Her gün saat 06:00'da otomatik çalışır
  schedule: [{cron: "0 6 * * *"}]
  # Manüel başlatmak için
  workflow_dispatch:
  # Her push sonrası (isteğe bağlı)
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # --- ANA METRİK BLOKLARI ---
          base: header, activity, community, repositories, metadata

          # --- TEMALAR ---
          config_display: large
          config_octicon: yes
          config_timezone: Europe/Istanbul
          config_twemoji: yes
          config_padding: 16, 8, 12, 8

          # --- AKTİVİTE & TRAFİK ---
          plugin_traffic: yes

          # --- CONTRIBUTORLAR ---
          plugin_contributors: yes
          plugin_contributors_head: 5
          plugin_contributors_ignored: ""

          # --- COMMIT HABBITS ---
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_from: 200

          # --- KONULAR (TAGS) ---
          plugin_topics: yes
          plugin_topics_limit: 10
          plugin_topics_mode: starred

          # --- PULL REQUESTS & ISSUES ---
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_discussions: yes

          # --- KATKILAR ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
